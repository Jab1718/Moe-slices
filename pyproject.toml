[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-slice"
version = "0.1.0"
description = "A High-Performance Toolkit for Slicing, Profiling, and Calibrating Deep Sparse MoE LLMs"
readme = "README.md"
authors = [{ name = "ThaiNQ", email = "thaicbhp5@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "safetensors>=0.4.0",
    "accelerate>=0.28.0"
]

[project.urls]
Homepage = "https://github.com/Jab1718/Moe-slices"
Repository = "https://github.com/Jab1718/Moe-slices"
